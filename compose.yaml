services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      DB_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    networks:
      - coffee-lab
    restart: unless-stopped
    volumes:
      - ./public:/var/www/html/public:ro

  web:
    image: nginx:1.27.5-bookworm
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/80; printf "GET /health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; IFS= read -r response <&3; [[ "$${response}" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coffee-lab
      - ingress
    ports:
      - "8083:80"
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro

  database:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    image: postgres:17-bookworm
    networks:
      - coffee-lab
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  coffee-lab:
    driver: bridge
    internal: true
  ingress:
    driver: bridge

volumes:
  postgres-data:
